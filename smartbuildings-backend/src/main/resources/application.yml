spring:
  application:
    name: smartbuildings  # 服务名
  config:
    # 导入本机环境配置（文件缺失时使用下方默认值，不影响启动）
    import: optional:classpath:application-env.yml
  datasource:
    # MySQL 连接（默认值可被 application-env.yml 或环境变量 MYSQL_HOST/MYSQL_USER/MYSQL_PASSWORD 覆盖）
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:3306/db_build_safe?characterEncoding=utf8&useSSL=false&zeroDateTimeBehavior=convertToNull&tinyInt1isBit=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    # 本地已有数据但还没纳入 Flyway 管理时，改为 true 做基线；全新项目保持 false
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:192.168.100.129}  # Redis 服务器地址（可被 application-env.yml 或环境变量 REDIS_HOST 覆盖）
      port: ${REDIS_PORT:6379}       # 端口
  jackson:
    # 全局日期反序列化格式（前端传参格式）
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区配置（避免时区偏移导致日期错误）
    time-zone: GMT+8
    serialization:
      # 可选：全局日期序列化格式（后端返回给前端的格式，可与反序列化格式一致）
      write-dates-as-timestamps: false  # 关闭时间戳，使用指定的字符串格式
#  jackson:
#    default-property-inclusion: non_null  # 序列化时排除所有 null 字段

# 端口配置
server:
  port: 8080
mybatis-plus:
  # 配置实体类所在包（多个包用逗号分隔）
  type-aliases-package: com.qst.smartbuildings.entity
  configuration:
    # 开启日志输出
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台打印日志
    # 可选：开启驼峰命名映射（默认开启）
    map-underscore-to-camel-case: true
device:
  tcp:
    port: 8888
camera:
  ai:
    baseUrl: http://localhost:5000/detect
  live:
    baseUrl: http://localhost:8068/hls/
tower:
  ai:
    baseUrl: http://localhost:5000/crane_safety
# Coze 智能监测助手配置
coze:
  api:
    url: ${COZE_API_URL:https://api.coze.cn/v3/chat}
    key: ${COZE_API_KEY:}
  bot:
    id: ${COZE_BOT_ID:}
  user:
    id: ${COZE_USER_ID:admin}
  auto-save-history: ${COZE_AUTO_SAVE_HISTORY:false}
  stream: ${COZE_STREAM:true}
  conversation:
    url: ${COZE_CONVERSATION_URL:https://api.coze.cn/v1/conversation}
  knowledge:
    # 知识库 ID（对应 Coze 知识库页面的 dataset_id）
    dataset-id: ${COZE_KNOWLEDGE_DATASET_ID:}
    document:
      list-url: ${COZE_KNOWLEDGE_LIST_URL:https://api.coze.cn/open_api/knowledge/document/list}
      create-url: ${COZE_KNOWLEDGE_CREATE_URL:https://api.coze.cn/open_api/knowledge/document/create}
      delete-url: ${COZE_KNOWLEDGE_DELETE_URL:https://api.coze.cn/open_api/knowledge/document/delete}
  # Coze 知识库（Database）配置：用于存储日报模板与报警规则提示词
  database:
    id: ${COZE_DATABASE_ID:}
    url: ${COZE_DATABASE_URL:https://api.coze.cn/v1/databases}
  # 第二个 Coze 知识库（报告文档库 safe_report_list）
  database2:
    id: ${COZE_DATABASE2_ID:}
  # Coze 同步报告文档的本地存储路径（相对项目根目录）
  document:
    storage-path: ${COZE_DOCUMENT_STORAGE_PATH:./doc-files/}
  # 定时任务配置：每日 20:00 触发日报生成
  cron: ${COZE_CRON:0 0 20 * * ?}
  scheduler:
    enabled: ${COZE_SCHEDULER_ENABLED:true}